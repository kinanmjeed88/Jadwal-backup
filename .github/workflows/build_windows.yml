name: Flutter Windows Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
      - 'release/**'
  push:
    branches:
      - main
      - master
      - 'release/**'
      - 'arena/**'

jobs:
  build:
    name: Analyze, Test, and Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter Sources
        shell: pwsh
        run: |
          $out = flutter analyze --no-fatal-infos 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $errors = ($out | Where-Object { $_ -match 'error -|warning -' }) -join " | "
            if ([string]::IsNullOrWhiteSpace($errors)) {
              $errors = ($out | Select-Object -Last 15) -join " | "
            }
            Write-Host "::error title=FlutterAnalyze::$errors"
            exit $code
          }

      - name: Run Flutter Tests
        shell: pwsh
        run: |
          $out = flutter test --machine 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          $events = @($out | ForEach-Object {
            try { $_.ToString() | ConvertFrom-Json -ErrorAction Stop } catch { }
          })
          $completed = @($events | Where-Object {
            $_.type -eq 'testDone' -and -not $_.hidden -and -not $_.skipped
          })
          $passed = @($completed | Where-Object { $_.result -eq 'success' }).Count
          $failed = @($completed | Where-Object { $_.result -ne 'success' }).Count
          $skipped = @($events | Where-Object {
            $_.type -eq 'testDone' -and $_.skipped -and -not $_.hidden
          }).Count
          Write-Host ('::warning title=Executed test results::Passed={0}; Failed={1}; Skipped={2}' -f $passed, $failed, $skipped)
          if ($passed -eq 0) { throw 'No completed tests recorded' }
          if ($code -ne 0) {
            $failLines = ($out | Where-Object { $_ -match 'Exception|Error|Expected|Actual|failed|══' } | Select-Object -First 25) -join " | "
            Write-Host "::error title=FlutterTest::$failLines"
            exit $code
          }

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Read Application Version
        id: version
        shell: pwsh
        run: |
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Unable to read application version from pubspec.yaml'
          }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Verify Windows Release Bundle
        shell: pwsh
        run: |
          $releaseDir = 'build\windows\x64\runner\Release'
          $executable = Join-Path $releaseDir 'jadwal_v2.exe'
          $dataDir = Join-Path $releaseDir 'data'
          if (-not (Test-Path $executable)) { throw "Missing executable: $executable" }
          if (-not (Test-Path $dataDir)) { throw "Missing Flutter data directory: $dataDir" }

      - name: Run Windows Smoke Test
        shell: pwsh
        timeout-minutes: 2
        run: >-
          pwsh -File windows\\packaging\\smoke_test.ps1
          -ExecutablePath build\\windows\\x64\\runner\\Release\\jadwal_v2.exe

      - name: Prepare temporary Windows signing configuration
        id: signing_config
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $configurationPath = Join-Path $env:RUNNER_TEMP 'jadwal-v2-signing.json'
          $hasCertificate = `
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -and `
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          $configuration = [ordered]@{
            certificateBase64 = if ($hasCertificate) { $env:WINDOWS_CERTIFICATE_BASE64 } else { '' }
            certificatePassword = if ($hasCertificate) { $env:WINDOWS_CERTIFICATE_PASSWORD } else { '' }
          }
          $configuration | ConvertTo-Json -Compress | Set-Content -LiteralPath $configurationPath -Encoding utf8
          "config_path=$configurationPath" >> $env:GITHUB_OUTPUT
          "enabled=$($hasCertificate.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Sign Windows Release Executable (Optional)
        if: steps.signing_config.outputs.enabled == 'true'
        shell: pwsh
        run: >-
          pwsh -File windows\\packaging\\sign_windows.ps1
          -ConfigurationPath "${{ steps.signing_config.outputs.config_path }}"
          -Path build\\windows\\x64\\runner\\Release\\jadwal_v2.exe

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Package Windows ZIP and Installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $releaseDir = Resolve-Path 'build\windows\x64\runner\Release'
          $distDir = Join-Path (Get-Location) 'dist'
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath (Join-Path $distDir "Jadwal-V2-Windows-$version.zip") -Force
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$releaseDir" "/DOutputDir=$distDir" 'windows\packaging\jadwal_v2.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Sign Windows Installer (Optional)
        if: steps.signing_config.outputs.enabled == 'true'
        shell: pwsh
        run: >-
          pwsh -File windows\\packaging\\sign_windows.ps1
          -ConfigurationPath "${{ steps.signing_config.outputs.config_path }}"
          -Path dist\\Jadwal-V2-Windows-${{ steps.version.outputs.version }}-Setup.exe

      - name: Archive Windows Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Jadwal-Windows-Release-${{ steps.version.outputs.version }}
          path: build\\windows\\x64\\runner\\Release\\*
          retention-days: 7

      - name: Upload Windows ZIP and Installer
        uses: actions/upload-artifact@v4
        with:
          name: Jadwal-Windows-Distributables-${{ steps.version.outputs.version }}
          path: |
            dist\*.zip
            dist\*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Write GitHub Actions artifact summary
        shell: pwsh
        run: >-
          pwsh -File windows\\packaging\\write_artifact_summary.ps1
          -PlatformLabel "Windows (main)"
          -ReleaseDir "build\\windows\\x64\\runner\\Release"
          -DistDir "dist"
          -ReleaseArtifactName "Jadwal-Windows-Release-${{ steps.version.outputs.version }}"
          -DistributablesArtifactName "Jadwal-Windows-Distributables-${{ steps.version.outputs.version }}"
          -ReleaseRetentionDays 7
          -DistributablesRetentionDays 30
          -CommitSha "${{ github.sha }}"

      - name: Remove temporary Windows signing configuration
        if: always()
        shell: pwsh
        env:
          SIGNING_CONFIG_PATH: ${{ steps.signing_config.outputs.config_path }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CONFIG_PATH)) {
            Remove-Item -LiteralPath $env:SIGNING_CONFIG_PATH -Force -ErrorAction SilentlyContinue
          }
