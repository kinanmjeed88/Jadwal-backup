name: Flutter Build

on:
  push:
    branches: [ "main", "master", "arena/**" ]
  pull_request:
    branches: [ "searchidf", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Clean Workspace
      run: flutter clean

    - name: Get Dependencies
      run: flutter pub get

    - name: Analyze Dart and Flutter Sources
      run: flutter analyze --no-fatal-infos

    - name: Run Flutter Tests
      run: flutter test

    - name: Server-Side Android Fix
      run: |
        sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle || true
        sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle.kts || true
        sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle || true
        sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts || true

    - name: Fix Isar Namespace & SDK Version
      run: |
        sed -i 's/compileSdkVersion/namespace "dev.isar.isar_flutter_libs"\n    compileSdkVersion/g' ~/.pub-cache/hosted/pub.dev/isar_flutter_libs-*/android/build.gradle
        sed -i -E 's/compileSdkVersion [0-9]+/compileSdkVersion 36/g' ~/.pub-cache/hosted/pub.dev/isar_flutter_libs-*/android/build.gradle
      
    - name: Generate App Icons
      run: flutter pub run flutter_launcher_icons

    # لا تُقرأ بيانات التوقيع ولا تُكتب إلا عندما تكون الأسرار الأربعة متوفرة.
    - name: Detect Android Signing Configuration
      id: signing
      env:
        STORE_FILE_BASE64: ${{ secrets.STORE_FILE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$STORE_FILE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Decode Keystore
      if: steps.signing.outputs.available == 'true'
      env:
        STORE_FILE_BASE64: ${{ secrets.STORE_FILE_BASE64 }}
      run: printf '%s' "$STORE_FILE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

    # يحتفظ الإنتاج بمسار Release الموقّع عند توفر الأسرار.
    - name: Build Signed Android Release
      if: steps.signing.outputs.available == 'true'
      env:
        STORE_FILE: ${{ runner.temp }}/upload-keystore.jks
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: flutter build apk --release --android-skip-build-dependency-validation

    # PRs التي لا تتلقى أسرار التوقيع يجب أن تثبت قابلية البناء دون ادعاء Release موقّع.
    - name: Build Android Debug (Unsigned Verification)
      if: steps.signing.outputs.available != 'true'
      run: flutter build apk --debug --android-skip-build-dependency-validation

    - name: Upload Signed Release APK
      if: steps.signing.outputs.available == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk

    - name: Upload Unsigned Verification APK
      if: steps.signing.outputs.available != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: debug-verification-apk
        path: build/app/outputs/flutter-apk/app-debug.apk

    - name: Write GitHub Actions artifact summary
      run: |
        set -euo pipefail
        version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)(\+([0-9]+))?.*/\1/p' pubspec.yaml | head -n1)"
        build="$(sed -nE 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+).*/\1/p' pubspec.yaml | head -n1)"
        if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
          apk="build/app/outputs/flutter-apk/app-release.apk"
          build_type="Release (signed)"
          artifact="release-apk"
          purpose="Signed production APK built with the repository signing secrets."
        else
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          build_type="Debug (unsigned verification)"
          artifact="debug-verification-apk"
          purpose="Unsigned CI verification APK; not a production release. Signing secrets were unavailable."
        fi
        if [ ! -f "$apk" ]; then
          echo "Missing APK at $apk" >&2
          exit 1
        fi
        size="$(wc -c < "$apk" | tr -d ' ')"
        {
          echo "# Jadwal artifacts — Android"
          echo
          echo "**Version:** ${version}"
          echo "**Build:** ${build:-unspecified}"
          echo "**Build type:** ${build_type}"
          echo "**Generated by:** GitHub Actions"
          echo "**Commit:** \`${GITHUB_SHA:0:7}\` (\`${GITHUB_SHA}\`)"
          echo "**Platform:** Android"
          echo
          echo "This workflow uploads **one** artifact."
          echo
          echo "## 1. \`${artifact}\`"
          echo
          echo "| Field | Value |"
          echo "|---|---|"
          echo "| Package | APK |"
          echo "| Type | ${build_type} Android application package |"
          echo "| Purpose | ${purpose} |"
          echo "| Platform | Android |"
          echo "| Build type | ${build_type} |"
          echo "| Workflow step | Upload APK |"
          echo "| Upload path | \`${apk}\` |"
          echo
          echo "Inspected file: \`$apk\` (${size} bytes)."
        } >> "$GITHUB_STEP_SUMMARY"
