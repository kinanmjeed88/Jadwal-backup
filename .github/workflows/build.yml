name: Flutter Build

on:
  push:
    branches: [ "main", "master", "arena/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Clean Workspace
      run: flutter clean

    - name: Get Dependencies
      run: flutter pub get

    - name: Server-Side Android Fix
      run: |
        sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle || true
        sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle.kts || true
        sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle || true
        sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts || true

    - name: Fix Isar Namespace & SDK Version
      run: |
        sed -i 's/compileSdkVersion/namespace "dev.isar.isar_flutter_libs"\n    compileSdkVersion/g' ~/.pub-cache/hosted/pub.dev/isar_flutter_libs-*/android/build.gradle
        sed -i -E 's/compileSdkVersion [0-9]+/compileSdkVersion 36/g' ~/.pub-cache/hosted/pub.dev/isar_flutter_libs-*/android/build.gradle
      
    - name: Generate App Icons
      run: flutter pub run flutter_launcher_icons

    # الخطوة المدمجة لفك تشفير المفتاح
    - name: Decode Keystore
      env:
        STORE_FILE_BASE64: ${{ secrets.STORE_FILE_BASE64 }}
      run: |
        echo $STORE_FILE_BASE64 | base64 --decode > $RUNNER_TEMP/upload-keystore.jks

    # خطوة البناء الموقعة باستخدام المتغيرات
    - name: Build Android Release
      env:
        STORE_FILE: ${{ runner.temp }}/upload-keystore.jks
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: flutter build apk --release --android-skip-build-dependency-validation

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk

    - name: Write GitHub Actions artifact summary
      run: |
        set -euo pipefail
        version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)(\+([0-9]+))?.*/\1/p' pubspec.yaml | head -n1)"
        build="$(sed -nE 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+).*/\1/p' pubspec.yaml | head -n1)"
        apk="build/app/outputs/flutter-apk/app-release.apk"
        if [ ! -f "$apk" ]; then
          echo "Missing APK at $apk" >&2
          exit 1
        fi
        size="$(wc -c < "$apk" | tr -d ' ')"
        {
          echo "# Jadwal artifacts — Android"
          echo
          echo "**Version:** ${version}"
          echo "**Build:** ${build:-unspecified}"
          echo "**Build type:** Release"
          echo "**Generated by:** GitHub Actions"
          echo "**Commit:** \`${GITHUB_SHA:0:7}\` (\`${GITHUB_SHA}\`)"
          echo "**Platform:** Android"
          echo
          echo "This workflow uploads **one** artifact."
          echo
          echo "## 1. \`release-apk\`"
          echo
          echo "| Field | Value |"
          echo "|---|---|"
          echo "| Package | APK |"
          echo "| Type | Signed Android application package |"
          echo "| Purpose | The file produced by \`flutter build apk --release\` at \`build/app/outputs/flutter-apk/app-release.apk\` after keystore decode. It is the installable Android build, not a Windows bundle. |"
          echo "| Platform | Android |"
          echo "| Build type | Release |"
          echo "| Workflow step | Upload APK |"
          echo "| Upload path | \`build/app/outputs/flutter-apk/app-release.apk\` |"
          echo
          echo "Inspected file: \`$apk\` (${size} bytes)."
        } >> "$GITHUB_STEP_SUMMARY"
